name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ci__${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build Docker images
    uses: TorqIT/pimcore-github-actions-workflows/.github/workflows/ci-docker.yml@v7
    permissions:
      contents: read
      actions: read
    with:
      RUN_UNIT_TESTS: true
    secrets:
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
