imports:
    - { resource: ../dev/config.yaml }

# Tests use an in-memory cache instead of the Valkey/Redis pool from config.yaml,
# so they neither depend on the cache service nor share cache entries with the dev instance.
# Pool options are merged per pool name across config files, so the provider inherited from
# config.yaml must be reset explicitly: the array adapter takes no provider, and an inherited
# one would shift default_lifetime to a constructor argument that does not exist.
framework:
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                tags: true
                default_lifetime: 31536000  # 1 year
                adapter: cache.adapter.array
                provider: ~

doctrine:
    dbal:
        connections:
            default:
                url: '%pimcore_test.db.dsn%'
                host: ~
                port: ~
                dbname: ~
                user: ~
                password: ~

parameters:
    pimcore_test.db.dsn: '%env(PIMCORE_TEST_DB_DSN)%'
    env(PIMCORE_TEST_DB_DSN): ~
